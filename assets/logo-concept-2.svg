<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow2" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#181825" />
      <stop offset="100%" stop-color="#0b0b10" />
    </radialGradient>

    <!-- Document Body Gradient -->
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2b3d" />
      <stop offset="100%" stop-color="#161622" />
    </linearGradient>

    <!-- Fold Corner Gradient -->
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#45475a" />
      <stop offset="100%" stop-color="#313244" />
    </linearGradient>

    <!-- Red/Coral Play Gradient -->
    <linearGradient id="playGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0055" />
      <stop offset="100%" stop-color="#ff5400" />
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0055" />
      <stop offset="50%" stop-color="#7209b7" />
      <stop offset="100%" stop-color="#4cc9f0" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="docShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="100" fill="url(#bgGlow2)" />
  <rect width="506" height="506" x="3" y="3" rx="97" fill="none" stroke="#313244" stroke-width="2" />

  <!-- The Document Sheet with Folded Corner -->
  <g filter="url(#docShadow)">
    <!-- Base Document: starts at 136,80; top edge to 306,80; slant fold to 376,150; down to 376,380; bottom left 136,380 -->
    <path d="M 140 80 
             L 300 80 
             L 372 152 
             L 372 380 
             A 20 20 0 0 1 352 400 
             L 160 400 
             A 20 20 0 0 1 140 380 
             Z" 
          fill="url(#docGrad)" 
          stroke="url(#neonBorder)" 
          stroke-width="3" />

    <!-- Folded Corner Triangle -->
    <path d="M 300 80 
             L 300 136 
             A 16 16 0 0 0 316 152 
             L 372 152 
             Z" 
          fill="url(#foldGrad)" 
          stroke="url(#neonBorder)" 
          stroke-width="2" />
  </g>

  <!-- Centered Play Button (Negative Space / Cutout Emblem) -->
  <g transform="translate(256, 215)">
    <!-- Glow halo -->
    <circle r="46" fill="#ff0055" fill-opacity="0.15" />
    <circle r="36" fill="url(#playGrad2)" />
    <!-- Play Triangle -->
    <path d="M -10 -18 L 18 0 L -10 18 Z" fill="#ffffff" />
  </g>

  <!-- Markdown Digest Key Takeaway Lines -->
  <!-- Bullet 1 -->
  <circle cx="180" cy="295" r="4.5" fill="#4cc9f0" />
  <rect x="200" y="291" width="145" height="8" rx="4" fill="#4cc9f0" fill-opacity="0.8" />

  <!-- Bullet 2 -->
  <circle cx="180" cy="325" r="4.5" fill="#7209b7" />
  <rect x="200" y="321" width="120" height="8" rx="4" fill="#a6adc8" fill-opacity="0.6" />

  <!-- Bullet 3 -->
  <circle cx="180" cy="355" r="4.5" fill="#f72585" />
  <rect x="200" y="351" width="85" height="8" rx="4" fill="#f72585" fill-opacity="0.7" />

  <!-- Gemini AI 4-Point Star perched on the top fold -->
  <g transform="translate(300, 80) scale(0.9)">
    <path d="M 0,-28 Q 0,0 28,0 Q 0,0 0,28 Q 0,0 -28,0 Q 0,0 0,-28 Z" fill="#4cc9f0" />
    <circle r="5" fill="#ffffff" />
  </g>

  <!-- Logo Typography -->
  <text x="256" y="455" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="32" letter-spacing="3" fill="#ffffff">
    Tube<tspan fill="#ff0055">Digest</tspan>
  </text>
  <text x="256" y="480" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="12" letter-spacing="5" fill="#6c7086">
    EDITORIAL VIDEO SUMMARIES
  </text>
</svg>