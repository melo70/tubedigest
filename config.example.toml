# ==============================================================================
# TubeDigest - Configuration Template
# ==============================================================================
# This configuration file defines parameters, credentials, and paths used by
# the TubeDigest pipeline to monitor YouTube channels, generate AI-powered
# summaries, and dispatch email digests.
#
# Copy this file to 'config.toml' and replace the placeholder values with your
# actual configuration and credentials.
#
# Channels and AI Prompts are stored and managed directly in SQLite via CLI:
#   python tubedigest.py --add-channel <CHANNEL_ID> --name <NAME>
#   python tubedigest.py --list-prompts
#
# VARIABLES OVERVIEW:
#
# [general]
#   language          : Default language for AI summaries and transcript preference (e.g. "en", "it", "es", "zh").
#
# [youtube]
#   feed_url_template : Template URL for YouTube RSS feeds with {channel_id} placeholder.
#
# [email]
#   sender            : Email address used to dispatch notifications.
#   password          : Application-specific password (app password) for SMTP authentication.
#   receiver          : Destination email address where summaries will be delivered.
#   smtp_server       : Outgoing SMTP server hostname (e.g. "smtp.gmail.com").
#   smtp_port         : Port number for SMTP submission (typically 587 for STARTTLS or 465 for SSL).
#
# [storage]
#   db_path           : Path to the SQLite database file (stores channels, authors, prompts, and videos).
#   templates_dir     : Directory containing default external template files (prompts and HTML emails).
#   logs_dir          : Directory where application execution logs are stored.
#   log_file          : Name of the log file (inside logs_dir).
#   log_max_bytes     : Maximum log file size in bytes before rotation (e.g. 1048576 = 1MB).
#   log_backup_count  : Number of rotated backup log files to retain.
#
# [gemini]
#   api_key           : Google Gemini API key used to authenticate with Google GenAI.
#   model             : Gemini model identifier (e.g. "gemini-2.5-flash", "gemini-3.6-flash").
# ==============================================================================

[general]
# Default language for AI summaries and transcript retrieval preference.
# Supported codes include: "en", "it", "es", "fr", "de", "zh", "hi", "ja", etc.
# Tracked channels can override this via CLI using --lang.
language = "en"

[youtube]
feed_url_template = "https://www.youtube.com/feeds/videos.xml?channel_id={channel_id}"

[email]
sender = "name.surname@example.com"
password = "your-app-password"
receiver = "name.surname@example.com"
smtp_server = "smtp.example.com"
smtp_port = 587

[storage]
db_path = "data/tubedigest.db"
templates_dir = "templates"
logs_dir = "logs"
log_file = "tubedigest.log"
log_max_bytes = 1048576
log_backup_count = 5

[gemini]
api_key = "YOUR_API_KEY"
model = "gemini-2.5-flash"
